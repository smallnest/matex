# examples/redis 的配置。
#
# 需要 Redis：先 `make dev`（或指向任意 redis）。redis 段配了才会初始化，
# 未配置时 env.Redis() 返回 ok=false（本示例会直接报错提示）。

http:
  addr: ":8080"
  timeout: 5s

log:
  level: info

redis:
  addr: ${REDIS_ADDR:localhost:6379}
  dial_timeout: 2s
  pool_size: 20

rediscache:
  prefix: "example:"     # key 前缀，方便和别的应用共用实例
  ttl: 30s               # 缓存 TTL
  lock_ttl: 5s           # 锁的租期（看门狗续租，临界区可比它长）
  wait_timeout: 2s       # Lock 阻塞等待的上限，超时返回 409
  watchdog: 1s           # 看门狗间隔（实际续租按 watchdog/3 跑）
  hold: 100ms            # 模拟临界区的耗时
