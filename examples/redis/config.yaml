# examples/redis 的配置。
#
# 需要 Redis：先 `make dev`（或指向任意 redis）。redis 段配了才会初始化，
# 未配置时 env.Redis == nil（本示例会直接报错提示）。

http:
  addr: ":8080"
  timeout: 5s

log:
  level: info

redis:
  addr: ${REDIS_ADDR:localhost:6379}
  dial_timeout: 2s
  pool_size: 20

rediscache:
  prefix: "example:"     # key 前缀，方便和别的应用共用实例
  ttl: 30s               # 缓存 TTL
  lock_ttl: 5s           # 锁的自动过期时间（持锁进程崩了也不会死锁）
  hold: 100ms            # 模拟临界区的耗时
