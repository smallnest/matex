# 本地开发依赖：postgres / mysql / redis / memcache / kafka（KRaft 单节点）。
# 用法：make dev   （stop: make dev-down）
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: matex
      POSTGRES_PASSWORD: matex
      POSTGRES_DB: matex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: matex
      MYSQL_DATABASE: matex
      MYSQL_USER: matex
      MYSQL_PASSWORD: matex
    # caching_sha2_password（8.0 默认）go-sql-driver 原生支持，无需额外参数。
    # DSN 记得带 parseTime=true，否则时间列只能扫成字符串。
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  memcached:
    image: memcached:1.6
    ports:
      - "11211:11211"

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"

volumes:
  pgdata:
  mysqldata:
